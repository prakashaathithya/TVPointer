name: Build APKs

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Ubuntu 24.04 runners come with the Android SDK preinstalled.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build app
        run: gradle assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir out
          cp app/build/outputs/apk/debug/app-debug.apk out/TvPointer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TvPointer-apk
          path: out/*.apk

      - name: Publish release with APK download links
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TV Pointer build ${{ github.run_number }}
          body: |
            Install **TvPointer.apk** on your phone. Nothing is needed on the TV.
          files: out/*.apk
