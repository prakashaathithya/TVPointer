name: Build APKs

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build app
        run: gradle assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir out
          cp app/build/outputs/apk/debug/app-debug.apk out/TvPointer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TvPointer-apk
          path: out/*.apk

      - name: Publish release with APK download links
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TV Pointer build ${{ github.run_number }}
          body: |
            Install **TvPointer.apk** on your phone. Nothing is needed on the TV.
          files: out/*.apk
